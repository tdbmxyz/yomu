[package]
name = "yomu-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "yomu Android shell (Tauri) around the shared web UI"
autobins = false

# Tauri's Android target builds this crate as a library.
[lib]
name = "yomu_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Keep Linux workspace builds free of Tauri's desktop webview stack.
[target.'cfg(target_os = "android")'.dependencies]
yomu-store.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
url.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
rand = "0.10"
