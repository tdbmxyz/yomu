[build]
target = "index.html"
dist = "dist"

[[hooks]]
stage = "pre_build"
command = "node"
command_arguments = ["../../scripts/prepare-reader-assets.mjs"]

[serve]
addresses = ["127.0.0.1"]
port = 8081

# Proxy API calls to a locally running yomu-server.
[[proxy]]
backend = "http://127.0.0.1:4700/api"
