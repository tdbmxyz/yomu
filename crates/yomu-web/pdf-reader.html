<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>PDF navigator</title>
  <style>
    html, body { margin: 0; background: #30343b; color: #eee; font: 1rem system-ui; }
    /* Reserve the vertical scrollbar before fit-width is measured, avoiding
       an accidental horizontal scrollbar after a tall page is rendered. */
    html { touch-action: pan-y; overflow-y: scroll; }
    html.zoomed { touch-action: pan-x pan-y; }
    /* Stable overlay clearance: hiding chrome must never resize/reflow the
       navigator or change the current page/scroll location. */
    body { padding: 72px 16px 80px; width: max-content; min-width: 100%; box-sizing: border-box; }
    @media (max-width: 640px) { body { padding-bottom: 128px; } }
    #status { position: fixed; inset: 1rem auto auto 1rem; z-index: 2; }
    #page { position: relative; margin: 0 auto; background: white; box-shadow: 0 2px 12px #0008; }
    canvas { display: block; width: 100%; height: 100%; }
    .textLayer { position: absolute; inset: 0; overflow: clip; line-height: 1;
      text-align: initial; transform-origin: 0 0; forced-color-adjust: none;
      --min-font-size: 1; --text-scale-factor: calc(var(--total-scale-factor) * var(--min-font-size));
      --min-font-size-inv: calc(1 / var(--min-font-size)); }
    .textLayer :is(span, br) { position: absolute; color: transparent;
      white-space: pre; cursor: text; transform-origin: 0 0; user-select: text; }
    .textLayer .markedContent { display: contents; }
    .textLayer > :not(.markedContent), .textLayer .markedContent span:not(.markedContent) {
      --font-height: 0; --scale-x: 1; --rotate: 0deg;
      font-size: calc(var(--text-scale-factor) * var(--font-height));
      transform: rotate(var(--rotate)) scaleX(var(--scale-x)) scale(var(--min-font-size-inv)); }
    .textLayer ::selection { background: rgb(0 100 255 / 0.25); }
  </style>
  <script type="module" src="pdf-reader.js"></script>
</head>
<body><p id="status" role="status">Loading PDF…</p><div id="page"><canvas aria-label="PDF page"></canvas><div class="textLayer" role="region" aria-label="PDF text"></div></div></body>
</html>
