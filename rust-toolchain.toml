[toolchain]
# Pinned so local, Nix, CI, desktop and Android builds use one compiler.
# Update deliberately (with Cargo.lock and CI) rather than following stable.
channel = "1.96.1"
components = ["rustfmt", "clippy", "rust-src", "rust-analyzer"]
targets = [
    "wasm32-unknown-unknown",
    # Tauri Android shell (the tauri CLI expects all four ABIs to exist)
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "i686-linux-android",
    "x86_64-linux-android",
]
profile = "default"
