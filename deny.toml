[graph]
all-features = true

[advisories]
# Yanked crates still surface in CI, but one is currently pinned transitively
# by sqlx/flume; make it visible without making all updates impossible.
yanked = "warn"
unmaintained = "workspace"
unsound = "all"
ignore = [
  # Tauri 2's Linux WebKit stack is still on gtk-rs 0.18. The affected
  # VariantStrIter API is not used by yomu; remove when Tauri upgrades gtk-rs.
  { id = "RUSTSEC-2024-0429", reason = "transitive Tauri GTK binding; affected iterator unused" },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "0BSD",
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
# Internal workspace path dependencies intentionally have no version.
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
