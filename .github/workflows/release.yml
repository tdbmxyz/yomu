# Release metadata: runs when a semver tag (v*) is pushed on main and creates
# the matching GitHub Release. Deployments consume the flake directly; builds
# of the web bundle in CI provided no value and made every release slow.
#
# The signed Android APK remains a local build and is attached afterwards by
# `just release-apk`; its keystore never leaves the developer machine.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "tag=$tag cargo=$cargo_version"
          test "$tag" = "$cargo_version"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            ## Server and desktop

            Deploy directly from the Nix flake:

            ```bash
            nix build github:tdbmxyz/yomu/${{ github.ref_name }}#yomu-server
            nix run github:tdbmxyz/yomu/${{ github.ref_name }}#yomu-desktop
            ```

            ## Android

            `yomu-*.apk` is a locally signed release APK. It is attached by
            `just release-apk`; the signing keystore never enters CI.
