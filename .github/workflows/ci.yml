# CI: format, lint, and test on every push/PR to the long-lived
# branches (Git flow: develop = integration, main = releases).
#
# yomu-shell is excluded from the cargo jobs: it needs the Linux webview
# stack and a baked-in web dist, both of which the `packages` job covers
# through `nix build .#yomu-desktop`.
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16

      # Persist the Nix store across runs: without this every job
      # re-downloads the whole dev-shell closure from cache.nixos.org —
      # several minutes before any step runs.
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-check-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-check-${{ runner.os }}-
          gc-max-store-size-linux: 6G
          purge: true
          purge-prefixes: nix-check-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      # Persist cargo deps + build artifacts so clippy/test only
      # recompile the crates that actually changed.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo fmt
        run: nix develop -c cargo fmt --check

      - name: cargo clippy
        run: |
          nix develop -c cargo clippy --workspace --exclude yomu-shell \
            --all-targets -- -D warnings

      - name: cargo clippy (wasm)
        # The UI actually ships as wasm; lint it for its real target.
        run: |
          nix develop -c cargo clippy -p yomu-ui -p yomu-web \
            --target wasm32-unknown-unknown -- -D warnings

      - name: cargo nextest
        run: nix develop -c cargo nextest run --workspace --exclude yomu-shell

      - name: dependency advisories, licenses, and sources
        run: nix develop -c cargo deny --locked check

  # Everything a release ships must build from the flake, including the
  # desktop shell (the one workspace member the cargo jobs skip).
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16

      # Same store-persistence as the check job, separate key: this
      # job's closure is the package build inputs, not the dev shell.
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-build-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-build-${{ runner.os }}-
          gc-max-store-size-linux: 6G
          purge: true
          purge-prefixes: nix-build-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: nix flake checks
        run: nix flake check --print-build-logs

      - name: nix build
        run: nix build .#yomu-server .#yomu-web .#yomu-desktop

      - name: cargo clippy (desktop shell)
        run: |
          nix build .#yomu-web --out-link result-web
          rm -rf crates/yomu-web/dist
          cp -rL result-web crates/yomu-web/dist
          nix develop .#tauri -c cargo clippy -p yomu-shell --all-targets -- -D warnings

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-e2e-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-e2e-${{ runner.os }}-
          gc-max-store-size-linux: 6G
          purge: true
          purge-prefixes: nix-e2e-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: build server and web app
        run: |
          nix build .#yomu-server --out-link result-server
          nix build .#yomu-web --out-link result-web
          rm -rf crates/yomu-web/dist
          cp -rL result-web crates/yomu-web/dist

      - name: Playwright journeys
        env:
          YOMU_E2E_SERVER: ${{ github.workspace }}/result-server/bin/yomu-server
        run: npm run test:e2e

      - name: upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-android-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'Cargo.lock', 'crates/yomu-shell/gen/android/**/*.kt', 'crates/yomu-shell/gen/android/**/*.kts') }}
          restore-prefixes-first-match: nix-android-${{ runner.os }}-
          gc-max-store-size-linux: 8G
          purge: true
          purge-prefixes: nix-android-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      # This compiles the checked-in MainActivity/WorkManager customization,
      # not just the Rust library. Debug needs no release keystore.
      - name: compile Android shell and Kotlin customization
        run: |
          env -u ANDROID_SDK_ROOT nix develop .#android -c bash -c '
            cd crates/yomu-shell
            cargo tauri android build --debug --apk --target aarch64
          '
